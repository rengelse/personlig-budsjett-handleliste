plugins {
    id 'com.android.application'
}

android {
    namespace 'no.personligbudsjett.handleliste'
    compileSdk 35

    defaultConfig {
        applicationId "no.personligbudsjett.handleliste"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    def camerax_version = "1.6.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Bundled model: QR scanning works immediately and does not depend on a model download.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
