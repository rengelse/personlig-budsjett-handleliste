<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https: wss:; img-src 'self' data: https:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personlig Budsjett</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark"><img src="assets/app-icon.png" alt="" aria-hidden="true"></div>
        <div>
          <h1>Personlig Budsjett</h1>
          <span>Økonomi og matplan på ett sted</span>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="period-control" role="group" aria-label="Global periode">
          <span class="period-control-label">Periode</span>
          <div class="period-fields">
            <select id="yearSelect" aria-label="Velg år"></select>
            <select id="monthSelect" aria-label="Velg måned eller hele året">
              <option value="all">Hele året</option>
              <option value="01">Januar</option><option value="02">Februar</option><option value="03">Mars</option>
              <option value="04">April</option><option value="05">Mai</option><option value="06">Juni</option>
              <option value="07">Juli</option><option value="08">August</option><option value="09">September</option>
              <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
            </select>
          </div>
        </div>
        <button class="btn primary quick-add-btn" id="quickAddBtn" title="Hurtigregistrering"><span aria-hidden="true">＋</span> Legg til</button>
        <button class="topbar-update-alert" id="topbarUpdateAlert" type="button" title="Ny versjon tilgjengelig" hidden>
          <span class="topbar-update-dot" aria-hidden="true"></span>
          <span class="topbar-update-copy"><strong>Ny versjon</strong><small id="topbarUpdateVersion"></small></span>
        </button>
      </div>
    </header>

    <nav class="primary-tabs" id="primaryTabs" aria-label="Hovednavigasjon">
      <button class="primary-tab active" data-section="overview">Oversikt</button>
      <button class="primary-tab" data-section="economy">Økonomi</button>
      <button class="primary-tab" data-section="food">Mat</button>
      <button class="primary-tab" data-section="analysis">Analyse</button>
      <button class="primary-tab" data-section="settings">Innstillinger</button>
    </nav>

    <div class="secondary-tabs-wrap">
      <nav class="secondary-tabs" id="secondaryTabs" aria-label="Undernavigasjon"></nav>
    </div>

    <main id="appContent" class="content"></main>

    <footer class="statusbar">
      <span class="storage-status"><span class="status-dot"></span> Lokal lagring</span>
      <span id="appVersion">Versjon lastes …</span>
    </footer>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div>
          <span class="eyebrow">Hurtigregistrering</span>
          <h2 id="modalTitle">Legg til post</h2>
        </div>
        <button class="icon-btn ghost" id="closeModalBtn" aria-label="Lukk">×</button>
      </header>
      <div class="modal-body">
        <div class="quick-type-grid">
          <button type="button" class="quick-type selected" data-type="expense">Utgift</button>
          <button type="button" class="quick-type" data-type="income">Inntekt</button>
          <button type="button" class="quick-type" data-type="meal">Måltid</button>
          <button type="button" class="quick-type" data-type="goal">Sparemål</button>
        </div>
        <div class="form-grid two-col" id="quickEntryForm">
          <label class="field"><span>Navn</span><input id="quickEntryName" name="name" type="text" autocomplete="off" /></label>
          <label class="field"><span>Beløp</span><input id="quickEntryAmount" name="amount" type="number" min="0" step="0.01" /></label>
          <label class="field quick-category-field" id="quickEntryCategoryField"><span>Kategori</span><div class="quick-category-control"><input id="quickEntryCategory" name="category" type="text" autocomplete="off" placeholder="Søk eller velg kategori" aria-autocomplete="list" aria-expanded="false" aria-controls="quickEntryCategoryMenu"><div class="quick-category-menu hidden" id="quickEntryCategoryMenu" role="listbox"></div></div></label>
          <label class="field"><span>Dato</span><input id="quickEntryDate" name="date" type="date" /></label>
        </div>
      </div>
      <footer class="modal-footer">
        <button class="btn secondary" id="cancelModalBtn">Avbryt</button>
        <button class="btn primary" id="saveEntryBtn">Lagre</button>
      </footer>
    </section>
  </div>

  <div class="toast hidden" id="toast">Lagret</div>

  <script src="js/data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/finance-engine.js"></script>
  <script src="js/pricing-engine.js"></script>
  <script src="js/recipe-price-refresh-engine.js"></script>
  <script src="js/price-change-engine.js"></script>
  <script src="js/shopping-engine.js"></script>
  <script src="js/pantry-analysis-engine.js"></script>
  <script src="js/meal-planning-engine.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.0.2/umd/zxing-browser.min.js"></script>
  <script src="js/barcode-engine.js"></script>
  <script src="js/companion-engine.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/components.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
